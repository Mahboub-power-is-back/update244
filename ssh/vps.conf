server {
  listen       89;
  server_name  127.0.0.1 localhost;
  access_log /var/log/nginx/vps-access.log;
  error_log /var/log/nginx/vps-error.log error;
  root   /home/vps/public_html;

  location / {
    index  index.html index.htm index.php;
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    include /etc/nginx/fastcgi_params;
    fastcgi_pass  127.0.0.1:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }
}

# Shared WebSocket front-end for Xray, Trojan-Go, SSH-WS and OpenVPN-WS.
# Both public ports are TLS-enabled so every protocol can use both 443 and 80.
server {
  listen 80 ssl;
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/xray/xray.crt;
  ssl_certificate_key /etc/xray/xray.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:WSSSL:10m;
  ssl_session_timeout 10m;

  # Xray VMess WebSocket
  location ^~ /vmess/ {
    proxy_pass http://127.0.0.1:10001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # Xray VLESS WebSocket
  location ^~ /vless/ {
    proxy_pass http://127.0.0.1:10002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # Xray Trojan WebSocket
  location ^~ /trojan/ {
    proxy_pass http://127.0.0.1:10003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # Trojan-Go WebSocket. Trojan-Go itself keeps TLS enabled on the loopback
  # backend; Nginx terminates the public TLS and re-encrypts to the backend.
  location ^~ /trojango {
    proxy_pass https://127.0.0.1:10004;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # SSH over WebSocket
  location ^~ /sshws/ {
    proxy_pass http://127.0.0.1:10005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-Host $http_x_real_host;
    proxy_set_header X-Pass $http_x_pass;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # SSH WS compatibility endpoint
  location ^~ /sshnontls/ {
    proxy_pass http://127.0.0.1:10007;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-Host $http_x_real_host;
    proxy_set_header X-Pass $http_x_pass;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # OpenVPN over WebSocket
  location ^~ /ovpnws/ {
    proxy_pass http://127.0.0.1:10006;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-Host $http_x_real_host;
    proxy_set_header X-Pass $http_x_pass;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  location / {
    return 404;
  }
}

